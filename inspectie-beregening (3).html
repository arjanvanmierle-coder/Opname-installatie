<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inspectie beregeningssysteem</title>
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#14231f;--mute:#5b6b66;--line:#d3dbd8;--acc:#0b6e5f;--acc-ink:#fff;--wa:#1a8f4a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a17;--card:#17251f;--ink:#e8f0ed;--mute:#9db0a9;--line:#2c3f38;--acc:#3fbfa8;--acc-ink:#06231d;--wa:#35b36a}}
:root[data-theme="dark"]{--bg:#0f1a17;--card:#17251f;--ink:#e8f0ed;--mute:#9db0a9;--line:#2c3f38;--acc:#3fbfa8;--acc-ink:#06231d;--wa:#35b36a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:16px;margin:0 0 10px;color:var(--acc)}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
label:first-of-type{margin-top:0}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;min-height:48px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:grid;gap:10px;margin-top:6px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;min-height:52px;padding:12px;cursor:pointer;color:var(--acc-ink);background:var(--acc)}
button.wa{background:var(--wa);color:#fff}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.link{background:none;color:var(--mute);min-height:44px;font-weight:400;text-decoration:underline}
#msg{min-height:22px;text-align:center;font-size:15px;color:var(--mute);margin:8px 0 0}
#fotoIn{display:none}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.th{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th button{position:absolute;top:4px;right:4px;min-height:32px;width:32px;padding:0;border-radius:16px;background:rgba(0,0,0,.65);color:#fff;font-size:18px;line-height:1}
#done{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
#done[hidden]{display:none}
#done .box{background:var(--card);color:var(--ink);border-radius:12px;padding:20px;max-width:420px;width:100%;display:grid;gap:10px}
#done h2{margin:0;color:var(--ink);font-size:19px}
#done p{margin:0;color:var(--mute);font-size:15px}
</style>
</head>
<body>
<main>
<h1>Inspectie beregeningssysteem</h1>

<section>
<h2>Opdracht</h2>
<label for="werkbon">Werkbonnummer</label>
<input id="werkbon" data-l="Werkbonnummer" autocomplete="off">
<label for="instid">Installatie-ID (indien bekend)</label>
<input id="instid" data-l="Installatie-ID" autocomplete="off">
<label for="klant">Locatie / klant</label>
<input id="klant" data-l="Locatie / klant" autocomplete="off">
<div class="row">
<div><label for="datum">Datum</label><input id="datum" data-l="Datum" type="date"></div>
<div><label for="monteur">Monteur</label><input id="monteur" data-l="Monteur" autocomplete="off"></div>
</div>
</section>

<section>
<h2>Installatie</h2>
<label for="bouwjaar">Bouwjaar</label>
<input id="bouwjaar" data-l="Bouwjaar" inputmode="numeric" placeholder="bijv. 2012">
<label for="bron">Waterbron</label>
<select id="bron" data-l="Waterbron"><option value="">Kies…</option><option>Waterleiding</option><option>Put / grondwater</option><option>Sloot / open water</option><option>Regenwater</option><option>Anders</option></select>
<label for="pompplek">Pomp</label>
<select id="pompplek" data-l="Pomp"><option value="">Kies…</option><option>Ondergronds</option><option>Bovengronds</option></select>
<label for="kw">Aantal kW</label>
<input id="kw" data-l="Pomp kW" inputmode="decimal" placeholder="bijv. 2,2">
<label for="aanst">Aansturing pomp</label>
<select id="aanst" data-l="Aansturing pomp"><option value="">Kies…</option><option>Frequentieregelaar</option><option>Softstarter</option><option>Anders</option></select>
<label for="aanstx">Toelichting aansturing (optioneel)</label>
<input id="aanstx" data-l="Toelichting aansturing">
</section>

<section>
<h2>Leidingwerk</h2>
<label for="mat">Materiaal</label>
<select id="mat" data-l="Leidingmateriaal"><option value="">Kies…</option><option>PE</option><option>PVC</option><option>Anders</option></select>
<div class="row">
<div><label for="dh">Diameter hoofdleiding</label><input id="dh" data-l="Diameter hoofdleiding" inputmode="decimal" placeholder="mm"></div>
<div><label for="dv">Diameter subleiding</label><input id="dv" data-l="Diameter subleiding" inputmode="decimal" placeholder="mm"></div>
</div>
</section>

<section>
<h2>Sproeiers, kleppen, besturing</h2>
<label for="sp">Sproeiers</label>
<input id="sp" data-l="Sproeiers" placeholder="vrije tekst">
<label for="kl">Kleppen: type en merk</label>
<input id="kl" data-l="Kleppen">
<label for="pc">Beregeningscomputer: merk en type</label>
<input id="pc" data-l="Beregeningscomputer">
</section>

<section>
<h2>Opmerkingen en foto's</h2>
<textarea id="opm" data-l="Opmerkingen"></textarea>
<input id="fotoIn" type="file" accept="image/*" multiple>
<button id="bFoto" class="sec" style="width:100%;margin-top:10px">Foto toevoegen</button>
<div id="thumbs" class="thumbs"></div>
</section>

<div class="actions">
<button id="bShare">Versturen als Excel…</button>
<button id="bWa" class="wa">Excel via WhatsApp</button>
<button id="bMail" class="sec">Excel via e-mail</button>
<button id="bCopy" class="sec">Kopieer tekst</button>
<button id="bClear" class="link">Formulier leegmaken</button>
</div>
<p id="msg" role="status"></p>
<div id="done" hidden role="dialog" aria-modal="true" aria-labelledby="doneT"><div class="box"><h2 id="doneT">Is het verstuurd?</h2><p>Controleer in WhatsApp dat het bericht met het Excel-bestand en de foto's is verzonden. Daarna maak je het formulier leeg voor de volgende inspectie.</p><button id="bYes">Ja, verstuurd. Nieuw formulier</button><button id="bNo" class="sec">Nee, terug naar het formulier</button></div></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
var fields=[].slice.call(document.querySelectorAll("[data-l]"));
var KEY="inspectie-beregening-v2";
var msg=document.getElementById("msg");
var photos=[];
function say(t){msg.textContent=t;setTimeout(function(){if(msg.textContent===t)msg.textContent="";},5000);}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function save(){try{var o={};fields.forEach(function(f){if(f.id!=="datum")o[f.id]=f.value;});localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function load(){try{var o=JSON.parse(localStorage.getItem(KEY)||"{}");fields.forEach(function(f){if(o[f.id]!=null)f.value=o[f.id];});}catch(e){}
document.getElementById("datum").value=today();}
fields.forEach(function(f){f.addEventListener("input",save);f.addEventListener("change",save);});
function v(id){return document.getElementById(id).value.trim();}
function datumNl(s){var p=s.split("-");return p.length===3?p[2]+"-"+p[1]+"-"+p[0]:s;}
function build(){
var L=["Inspectie beregeningssysteem",""];
fields.forEach(function(f){
var val=f.value.trim();if(f.id==="datum")val=datumNl(val);
L.push(f.getAttribute("data-l")+": "+(val||"-"));
});
L.push("Foto's: "+photos.length);
return L.join("\n");
}
function subject(){return "Inspectie beregening"+(v("werkbon")?" - werkbon "+v("werkbon"):"")+(v("klant")?" - "+v("klant"):"");}
function open(url){var w=window.open(url,"_blank");if(!w){location.href=url;}}

/* foto's */
function toJpeg(file,name){return new Promise(function(res){
var u=URL.createObjectURL(file),img=new Image();
img.onload=function(){var s=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement("canvas");
c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
c.toBlob(function(b){URL.revokeObjectURL(u);res(b?new File([b],name,{type:"image/jpeg"}):file);},"image/jpeg",0.82);};
img.onerror=function(){URL.revokeObjectURL(u);res(file);};
img.src=u;});}
function drawThumbs(){
var box=document.getElementById("thumbs");box.innerHTML="";
photos.forEach(function(p,i){
var d=document.createElement("div");d.className="th";
var im=document.createElement("img");im.src=p.url;im.alt="Foto "+(i+1);
var b=document.createElement("button");b.type="button";b.textContent="×";b.setAttribute("aria-label","Foto "+(i+1)+" verwijderen");
b.onclick=function(){URL.revokeObjectURL(p.url);photos.splice(i,1);drawThumbs();};
d.appendChild(im);d.appendChild(b);box.appendChild(d);});
}
var fin=document.getElementById("fotoIn");
document.getElementById("bFoto").onclick=function(){fin.click();};
fin.onchange=function(){
var list=[].slice.call(fin.files);fin.value="";
if(!list.length)return;
say("Foto's verwerken…");
var wb=v("werkbon")||"inspectie";
Promise.all(list.map(function(f,k){return toJpeg(f,"foto-"+wb+"-"+(photos.length+k+1)+".jpg");})).then(function(files){
files.forEach(function(f){photos.push({file:f,url:URL.createObjectURL(f)});});
drawThumbs();say(photos.length+" foto's toegevoegd.");
});
};

/* versturen */
function xlsxFile(){
if(!window.XLSX)return null;
try{
var cols=[["Installatie-ID","instid"],["Klant / locatie","klant"],["Adres",""],["Postcode",""],["Plaats",""],["Bouwjaar","bouwjaar"],["Waterbron","bron"],["Pomp","pompplek"],["Aantal kW","kw"],["Aansturing pomp","aanst"],["Leidingmateriaal","mat"],["Diameter hoofdleiding (mm)","dh"],["Diameter subleiding (mm)","dv"],["Sproeiers","sp"],["Kleppen","kl"],["Beregeningscomputer","pc"],["Datum laatste inspectie","datum"],["Werkbonnummer laatste inspectie","werkbon"],["Syntess installatienummer",""],["Opmerkingen","opm"]];
var head=cols.map(function(c){return c[0];});
var row=cols.map(function(c){if(!c[1])return "";var val=v(c[1]);return c[1]==="datum"?datumNl(val):val;});
var ws=XLSX.utils.aoa_to_sheet([head,row]);ws["!cols"]=head.map(function(h){return {wch:Math.max(14,h.length)};});
var rows=[["Veld","Waarde"]];
fields.forEach(function(f){var val=f.value.trim();if(f.id==="datum")val=datumNl(val);rows.push([f.getAttribute("data-l"),val]);});
rows.push(["Foto's",String(photos.length)]);
var ws2=XLSX.utils.aoa_to_sheet(rows);ws2["!cols"]=[{wch:28},{wch:46}];
var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Installaties");XLSX.utils.book_append_sheet(wb,ws2,"Inspectie");
var arr=XLSX.write(wb,{bookType:"xlsx",type:"array"});
var nm=("inspectie-"+(v("werkbon")||"beregening")).replace(/[^\w-]+/g,"-")+".xlsx";
return new File([arr],nm,{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}catch(e){return null;}
}
function files(){var x=xlsxFile(),a=photos.map(function(p){return p.file;});return x?[x].concat(a):a;}
function canFiles(){var f=files();return f.length&&navigator.canShare&&navigator.canShare({files:f});}
function shareAll(){
var t=build(),data={title:subject(),text:t};
if(canFiles()){data.files=files();}
else{say("Bijlagen meesturen lukt hier niet; alleen de tekst wordt verstuurd.");}
function fail(en){copy(t);setTimeout(function(){say("Delen geblokkeerd"+(en?" ("+en+")":"")+". De tekst is gekopieerd; plak hem in Mail of WhatsApp.");},300);}
if(!navigator.share){fail();return;}
navigator.share(data).then(function(){askDone();}).catch(function(e){
 if(e&&e.name==="AbortError"){say("Delen afgebroken (AbortError).");return;}
 var en=e&&e.name?e.name:"onbekend";
 if(data.files){delete data.files;navigator.share(data).then(function(){askDone();}).catch(function(){fail(en);});}
 else{fail(en);}
});
}
document.getElementById("bShare").onclick=shareAll;
document.getElementById("bWa").onclick=function(){
if(canFiles()){shareAll();return;}
open("https://wa.me/?text="+encodeURIComponent(build()));};
document.getElementById("bMail").onclick=function(){
if(canFiles()){shareAll();return;}
open("mailto:?subject="+encodeURIComponent(subject())+"&body="+encodeURIComponent(build()));};
function copy(t){
function ok(){say("Tekst gekopieerd. Plak hem in WhatsApp of e-mail.");}
function fb(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok();}catch(e){say("Kopiëren lukte niet.");}document.body.removeChild(a);}
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,fb);}else{fb();}
}
document.getElementById("bCopy").onclick=function(){copy(build());};
document.getElementById("bClear").onclick=function(){
if(!confirm("Alles leegmaken, inclusief foto's?"))return;
fields.forEach(function(f){f.value="";});
photos.forEach(function(p){URL.revokeObjectURL(p.url);});photos=[];drawThumbs();
document.getElementById("datum").value=today();save();say("Formulier is leeg.");
};
function wipe(){
fields.forEach(function(f){if(f.id!=="monteur")f.value="";});
photos.forEach(function(p){URL.revokeObjectURL(p.url);});photos=[];drawThumbs();
document.getElementById("datum").value=today();save();window.scrollTo(0,0);
}
function askDone(){document.getElementById("done").hidden=false;}
document.getElementById("bYes").onclick=function(){document.getElementById("done").hidden=true;wipe();say("Verstuurd. Het formulier is leeg voor de volgende inspectie.");};
document.getElementById("bNo").onclick=function(){document.getElementById("done").hidden=true;};
load();
})();
</script>
</body>
</html>
